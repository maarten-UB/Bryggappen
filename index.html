<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bryggappen</title>

<meta name="theme-color" content="#18b398">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bryggappen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}
body{
  background:#18b398;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:34px 18px;
}
.container{
  width:100%;
  max-width:430px;
  text-align:center;
}
.logo{
  width:min(88%,390px);
  height:auto;
  margin:18px auto 12px;
  display:block;
}
.subtitle{
  color:#fff;
  font-size:18px;
  font-weight:500;
  margin-bottom:38px;
}
.button{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  min-height:124px;
  margin:0 0 30px;
  padding:20px;
  background:#fff;
  color:#222;
  border-radius:22px;
  text-decoration:none;
  font-size:38px;
  font-weight:700;
  box-shadow:0 5px 10px rgba(0,0,0,.08);
  -webkit-tap-highlight-color:transparent;
}
.button:active{
  transform:scale(.99);
}
</style>
</head>

<body>
<div class="container">

  <img class="logo" src="icon-512.png" alt="Uppsala Brygghus">

  <div class="subtitle">Produktionsapp</div>

  <a class="button" href="https://script.google.com/a/macros/uppsalabrygghus.se/s/AKfycbxCeKyc8kK12cTF5WfWKp52CjcjADjcQ7pR8MpmBcODwA66TAYGMfJzh1chfYTgwENWRA/exec?page=bryggning">Bryggning</a>
  <a class="button" href="https://script.google.com/a/macros/uppsalabrygghus.se/s/AKfycbxCeKyc8kK12cTF5WfWKp52CjcjADjcQ7pR8MpmBcODwA66TAYGMfJzh1chfYTgwENWRA/exec?page=jasning">Jäsning</a>
  <a class="button" href="https://script.google.com/a/macros/uppsalabrygghus.se/s/AKfycbxCeKyc8kK12cTF5WfWKp52CjcjADjcQ7pR8MpmBcODwA66TAYGMfJzh1chfYTgwENWRA/exec?page=tappning">Tappning</a>

</div>
</body>
</html>
